# Generated by scripts/proposals/form.ts from src/community/proposal.ts; edit those, not this file.
name: Propose a correction
description: Correct a figure, a rule or a source, citing the official text it comes from.
title: "Correction: "
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: "Propose a correction to a figure, a rule or a source. Cite the official text it comes from: the statute, the official gazette, the official table or page. A news article can lead to it but is not a citation, and link-only sites (Numbeo, WeatherSpark and the others marked link-only in the registry) cannot be cited.\n\nThis issue is public and stays under your account: leave out personal details. A check runs on every edit and says what to fix. Nothing reaches the site until a reviewed pull request merges. See CONTRIBUTING.md."
  - type: input
    id: kind
    attributes:
      label: "Kind of change"
      description: "One of: correction (a figure shown is wrong), figure (a figure Borgo lacks, from an official table), rule-change (a tax, leave, residence or law rule changed), source (a registry entry), link (a broken or missing link)."
      placeholder: "correction"
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: "City id"
      description: "For a figure: the city's id (london-gb), as `borgo search` shows it."
      placeholder: "london-gb"
    validations:
      required: false
  - type: input
    id: metric
    attributes:
      label: "Metric id"
      description: "For a figure: the metric's id (rent_1bed). `borgo catalogue --kind metrics` lists them."
      placeholder: "rent_1bed"
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: "Registry source id"
      description: "For a figure: the registry source it comes from (ons-pipr), when there is one."
      placeholder: "ons-pipr"
    validations:
      required: false
  - type: input
    id: file
    attributes:
      label: "File"
      description: "For a rule, source or link: the file that holds it (src/tax/it.ts, registry/ons-pipr.json)."
      placeholder: "src/tax/it.ts"
    validations:
      required: false
  - type: input
    id: path
    attributes:
      label: "Path in the file"
      description: "For a rule, source or link: what inside the file changes (IRPEF_2026, ABORTION.US-NY, homepage)."
      placeholder: "IRPEF_2026"
    validations:
      required: false
  - type: input
    id: current
    attributes:
      label: "Value shown now"
      description: "As Borgo shows it today."
    validations:
      required: false
  - type: textarea
    id: proposed
    attributes:
      label: "Proposed value"
      description: "For a figure: the number in the metric's unit (12 numbers, separated by spaces, for a monthly figure). For a rule: the new rule in a sentence."
    validations:
      required: true
  - type: input
    id: unit
    attributes:
      label: "Unit"
      description: "The unit of the proposed figure (GBP/month)."
      placeholder: "GBP/month"
    validations:
      required: false
  - type: input
    id: period
    attributes:
      label: "Period"
      description: "The time the value describes (2026-09, 2026, 2026-04-06)."
      placeholder: "2026-09"
    validations:
      required: false
  - type: input
    id: level
    attributes:
      label: "Level"
      description: "What area the value describes: city, metro, region or country."
      placeholder: "city"
    validations:
      required: false
  - type: input
    id: citation_url
    attributes:
      label: "Official source address"
      description: "The primary text: the statute, the official gazette, the official table or page. Never a news article, a blog or a link-only site such as Numbeo."
    validations:
      required: true
  - type: input
    id: citation_type
    attributes:
      label: "What the source is"
      description: "One of: statute, gazette, official-table, official-page, registry (a source already in Borgo's registry)."
      placeholder: "official-table"
    validations:
      required: true
  - type: input
    id: citation_publisher
    attributes:
      label: "Publisher"
      description: "Who publishes it (Office for National Statistics)."
      placeholder: "Office for National Statistics"
    validations:
      required: true
  - type: input
    id: citation_title
    attributes:
      label: "Title"
      description: "The table's or text's title."
    validations:
      required: true
  - type: input
    id: citation_accessed
    attributes:
      label: "Read on"
      description: "The day you read it, YYYY-MM-DD."
      placeholder: "2026-11-05"
    validations:
      required: true
  - type: textarea
    id: citation_quote
    attributes:
      label: "Quote"
      description: "Optional: a short passage from the source that states the value, copied exactly. The check looks for it on the page."
    validations:
      required: false
  - type: textarea
    id: leads
    attributes:
      label: "Leads"
      description: "Optional: news or other pages that pointed you to the change, one address per line. They are not citations."
    validations:
      required: false
  - type: input
    id: proposer
    attributes:
      label: "Proposed by"
      description: "person, or agent for an AI agent."
      placeholder: "person"
    validations:
      required: false
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "For an agent: its name and version (name@1.2)."
      placeholder: "name@1.0"
    validations:
      required: false
  - type: input
    id: operator
    attributes:
      label: "Operator"
      description: "For an agent: the person or project that runs it and answers for it."
    validations:
      required: false
  - type: textarea
    id: note
    attributes:
      label: "Note"
      description: "Optional: anything a reviewer should know. This issue is public: leave out personal details."
    validations:
      required: false
  - type: checkboxes
    id: grant
    attributes:
      label: "Licence"
      description: "Contributed data is published under CC BY 4.0 (see CONTRIBUTING.md)."
      options:
        - label: "I contribute this under CC BY 4.0, and I read it in the official source I cite (not copied from a closed site)"
          required: true
